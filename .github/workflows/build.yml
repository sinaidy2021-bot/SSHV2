name: 自动构建 iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 初始化日志环境
        run: |
          mkdir -p logs
          xcodebuild -version > logs/env_info.log 2>&1
          xcrun --sdk iphoneos --show-sdk-path >> logs/env_info.log 2>&1

      - name: 编译并打包应用
        run: |
          set -o pipefail
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK 路径: $SDK_PATH" | tee logs/build.log

          swift build -c release \
            --triple arm64-apple-ios17.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH" \
            -Xcc -isysroot -Xcc "$SDK_PATH" \
            -Xcc -target -Xcc arm64-apple-ios17.0 \
            2>&1 | tee -a logs/build.log

          echo "=== 正在定位编译生成的二进制文件 ===" | tee -a logs/build.log
          # 自动全局搜索刚才链接成功的 MySSH 二进制执行文件，避免写死路径
          BIN_PATH=$(find .build -type f -perm +111 -name "MySSH" | grep -v "\.build/checkouts" | head -n 1)
          
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find .build -type f -name "MySSH" | grep -v "\.build/checkouts" | head -n 1)
          fi

          echo "找到可执行文件路径: $BIN_PATH" | tee -a logs/build.log

          if [ ! -f "$BIN_PATH" ]; then
            echo "未找到二进制文件，输出 .build 目录结构以供排查：" | tee -a logs/build.log
            find .build -maxdepth 4 >> logs/build.log
            exit 1
          fi

          echo "=== 正在组装 Payload 目录结构 ===" | tee -a logs/build.log
          mkdir -p build/Payload/MySSH.app
          cp "$BIN_PATH" build/Payload/MySSH.app/MySSH 2>&1 | tee -a logs/build.log
          cp Sources/MySSH/Info.plist build/Payload/MySSH.app/ 2>&1 | tee -a logs/build.log
          chmod +x build/Payload/MySSH.app/MySSH

          echo "=== 正在压制打包 MySSH.ipa ===" | tee -a logs/build.log
          cd build
          zip -r MySSH.ipa Payload 2>&1 | tee -a ../logs/build.log
          cd ..

      - name: 🚨 失败时：直接在此处输出核心错误日志
        if: failure()
        run: |
          echo "==================== 【核心错误日志开始】 ===================="
          if [ -f logs/build.log ]; then
            tail -n 60 logs/build.log
          fi
          echo "==================== 【核心错误日志结束】 ===================="

      - name: 成功时上传 IPA 成品
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-IPA
          path: build/MySSH.ipa

      - name: 完整日志归档保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译与排错完整日志
          path: logs/
