name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate source
        run: |
          set -euo pipefail
          zt=0; lt=0
          if [ -f PhoneProxy.zip ]; then zt=$(git log -1 --format=%ct -- PhoneProxy.zip); fi
          if [ -f project.yml ]; then lt=$(git log -1 --format=%ct -- project.yml App Core Shared); fi
          if [ "$zt" -gt "$lt" ]; then
            echo "使用 PhoneProxy.zip"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q PhoneProxy.zip -d "$RUNNER_TEMP/src"
            SRC=$(dirname "$(find "$RUNNER_TEMP/src" -name project.yml | head -1)")
          elif [ -f project.yml ]; then
            echo "使用仓库根目录的散开文件"
            SRC="$GITHUB_WORKSPACE"
          else
            echo "::error::找不到 PhoneProxy.zip 或 project.yml"; exit 1
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          ls -la "$SRC"
          if ! grep -q startUDP "$SRC/Core/Socks5Server.swift"; then
            echo "::error::这是旧版本（没有 UDP 功能），请重新上传最新的 PhoneProxy.zip"; exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - name: Generate project
        working-directory: ${{ env.SRC }}
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ${{ env.SRC }}
        run: xcodebuild -resolvePackageDependencies -project PhoneProxy.xcodeproj -scheme PhoneProxy

      - name: Archive
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project PhoneProxy.xcodeproj \
            -scheme PhoneProxy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PhoneProxy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log

      - name: Show errors
        if: failure()
        working-directory: ${{ env.SRC }}
        run: grep -E "error:" build/xcodebuild.log | awk '!seen[$0]++' | head -40 || true

      - name: Package IPA
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/PhoneProxy.xcarchive/Products/Applications/PhoneProxy.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../PhoneProxy-unsigned.ipa Payload)
          ls -lh build/PhoneProxy-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneProxy-unsigned
          path: ${{ env.SRC }}/build/PhoneProxy-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ env.SRC }}/build/xcodebuild.log
          if-no-files-found: ignore
