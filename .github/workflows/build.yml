name: Build PhoneProxy IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 清理残留文件并还原纯净源码
        run: |
          # 删除之前注入产生冲突的额外文件
          rm -f PhoneProxy/Core/Socks5UDPSession.swift
          git checkout -- PhoneProxy/ 2>/dev/null || true

      - name: 生成工程
        run: |
          brew install xcodegen
          cd PhoneProxy
          xcodegen generate
          # 兼容降级
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' PhoneProxy.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/g' PhoneProxy.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: 编译并打包 IPA
        run: |
          cd PhoneProxy

          # 编译原生代码，输出具体编译日志
          set -o pipefail
          xcodebuild build \
            -project PhoneProxy.xcodeproj \
            -scheme PhoneProxy \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$(pwd)/build" 2>&1 | tee build.log | grep -E "(error:|fatal error:|BUILD FAILED|\*\* BUILD)" || true

          # 检查是否成功产出 .app
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "========== 编译失败，以下为错误日志详情 =========="
            grep -C 3 "error:" build.log || tail -n 50 build.log
            exit 1
          fi

          echo "打包 IPA，路径: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q PhoneProxy.ipa Payload/
          mv PhoneProxy.ipa ../

      - name: 上传 IPA 安装包
        uses: actions/upload-artifact@v4
        with:
          name: PhoneProxy-IPA
          path: PhoneProxy.ipa
