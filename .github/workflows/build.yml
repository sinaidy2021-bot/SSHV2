name: Build PhoneProxy IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          cd PhoneProxy
          xcodegen generate
          # 兼容降级，防止 format 77 格式不认
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' PhoneProxy.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/g' PhoneProxy.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: 编译并打包 IPA
        run: |
          cd PhoneProxy
          
          # 使用原生编译，打印具体错误并输出到 build 目录
          xcodebuild build \
            -project PhoneProxy.xcodeproj \
            -scheme PhoneProxy \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build"

          # 查找生成的 .app 目录
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未生成 .app 文件"
            exit 1
          fi

          echo "Found App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q PhoneProxy.ipa Payload/
          mv PhoneProxy.ipa ../

      - name: 上传 IPA 安装包
        uses: actions/upload-artifact@v4
        with:
          name: PhoneProxy-IPA
          path: PhoneProxy.ipa
