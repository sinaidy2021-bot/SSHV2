name: Unzip PhoneProxy

on:
  workflow_dispatch: # 支持在 GitHub 网页手动一键点击运行

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予推送解压后代码到仓库的权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 解压 PhoneProxy.zip
        run: |
          if [ -f "PhoneProxy.zip" ]; then
            unzip -o PhoneProxy.zip
            # 解压完成后删除 zip 压缩包（如需保留 zip，请删除下面这行）
            rm PhoneProxy.zip
          else
            echo "未找到 PhoneProxy.zip" && exit 1
          fi

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 解压 PhoneProxy 源码文件" && git push)
