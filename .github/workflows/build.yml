name: 自动构建 iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 检查系统与环境
        run: |
          mkdir -p logs
          echo "=== 编译环境信息 ===" > logs/env_info.log
          xcodebuild -version >> logs/env_info.log 2>&1
          swift --version >> logs/env_info.log 2>&1
          cat logs/env_info.log

      - name: 编译并打包应用 (带日志捕获)
        run: |
          set -o pipefail
          echo "=== 开始编译构建过程 ==="

          # 1. 执行编译并捕获详细日志到 build.log
          swift build -c release --triple arm64-apple-ios16.0 2>&1 | tee logs/build.log

          # 2. 组装 Payload
          mkdir -p build/Payload/MySSH.app
          cp .build/arm64-apple-ios16.0/release/MySSH build/Payload/MySSH.app/
          cp Sources/MySSH/Info.plist build/Payload/MySSH.app/

          # 3. 压制为标准 .ipa 文件
          cd build
          zip -r MySSH.ipa Payload 2>&1 | tee -a ../logs/build.log
          cd ..

      - name: 成功时上传 IPA 成品
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-IPA
          path: build/MySSH.ipa

      - name: 捕获并上传构建/错误日志 (无论成功或失败均执行)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译与排错日志-build-logs
          path: logs/
