name: 自动构建 iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 初始化日志环境
        run: |
          mkdir -p logs
          echo "=== 编译环境信息 ===" > logs/env_info.log
          xcodebuild -version >> logs/env_info.log 2>&1
          xcrun --sdk iphoneos --show-sdk-path >> logs/env_info.log 2>&1

      - name: 编译并打包应用
        id: build_step
        run: |
          set -o pipefail
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "使用的 iOS SDK 路径: $SDK_PATH" | tee logs/build.log

          # 执行编译并捕获所有输出到 logs/build.log
          swift build -c release \
            --triple arm64-apple-ios16.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH" \
            -Xcc -isysroot -Xcc "$SDK_PATH" \
            -Xcc -target -Xcc arm64-apple-ios16.0 \
            2>&1 | tee -a logs/build.log

          echo "正在组装 Payload 目录结构..." | tee -a logs/build.log
          mkdir -p build/Payload/MySSH.app
          cp .build/arm64-apple-ios16.0/release/MySSH build/Payload/MySSH.app/ 2>&1 | tee -a logs/build.log
          cp Sources/MySSH/Info.plist build/Payload/MySSH.app/ 2>&1 | tee -a logs/build.log

          echo "正在压制打包 MySSH.ipa..." | tee -a logs/build.log
          cd build
          zip -r MySSH.ipa Payload 2>&1 | tee -a ../logs/build.log
          cd ..

      - name: 🚨 失败时：直接在此处输出核心错误日志
        if: failure()
        run: |
          echo "==================== 【核心错误日志开始】 ===================="
          if [ -f logs/build.log ]; then
            # 抓取包含 error: 的行以及前后关联上下文
            grep -B 2 -A 4 -E "(error:|fatalError:)" logs/build.log | tail -n 50 || tail -n 40 logs/build.log
          else
            echo "未找到 build.log 文件！"
          fi
          echo "==================== 【核心错误日志结束】 ===================="

          # 同时将错误直接渲染到 GitHub 页面顶部的 Summary 看板上（方便手机端直接查看）
          echo "## ❌ 编译失败 - 关键报错捕获" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -B 2 -A 4 -E "(error:|fatalError:)" logs/build.log | tail -n 40 >> $GITHUB_STEP_SUMMARY \vert{}\vert{} tail -n 30 logs/build.log >>$GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 成功时上传 IPA 成品
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-IPA
          path: build/MySSH.ipa

      - name: 完整日志归档保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译与排错完整日志
          path: logs/
