name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Locate source
        run: |
          set -euo pipefail
          if [ -f PhoneProxy.zip ]; then
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q PhoneProxy.zip -d "$RUNNER_TEMP/src"
            SRC="$RUNNER_TEMP/src/PhoneProxy"
          else
            SRC="$GITHUB_WORKSPACE"
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          ls -la "$SRC"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - name: Generate project
        working-directory: ${{ env.SRC }}
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ${{ env.SRC }}
        run: xcodebuild -resolvePackageDependencies -project PhoneProxy.xcodeproj -scheme PhoneProxy

      - name: Archive
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project PhoneProxy.xcodeproj \
            -scheme PhoneProxy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PhoneProxy.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/PhoneProxy.xcarchive/Products/Applications/PhoneProxy.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../PhoneProxy-unsigned.ipa Payload)
          ls -lh build/PhoneProxy-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneProxy-unsigned
          path: ${{ env.SRC }}/build/PhoneProxy-unsigned.ipa
