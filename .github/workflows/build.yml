name: Build PhoneProxy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 支持网页手动点击运行

jobs:
  build:
    runs-on: macos-14 # 使用 macOS Runner 编译 iOS/macOS 目标

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目工程
        working-directory: PhoneProxy
        run: xcodegen generate

      - name: 构建 iOS App (模拟器无证书编译)
        working-directory: PhoneProxy
        run: |
          xcodebuild build \
            -project PhoneProxy.xcodeproj \
            -scheme PhoneProxy \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
