name: Build PhoneProxy IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 清理并还原纯净源码
        run: |
          rm -f PhoneProxy/Core/Socks5UDPSession.swift
          git checkout -- PhoneProxy/ 2>/dev/null || true

      - name: 生成工程
        run: |
          brew install xcodegen
          cd PhoneProxy
          xcodegen generate
          # 兼容降级
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' PhoneProxy.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/g' PhoneProxy.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: 编译真机二进制并完整打包 IPA
        run: |
          cd PhoneProxy

          # 采用 Ad-hoc 本地伪签名 (-)，强制输出完整的 Mach-O 二进制文件
          xcodebuild clean build \
            -project PhoneProxy.xcodeproj \
            -scheme PhoneProxy \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SYMROOT="$(pwd)/build"

          # 验证二进制是否存在
          APP_PATH=$(find build/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到构建的 .app 目录"
            exit 1
          fi

          echo "检查构建出的可执行文件："
          ls -lh "$APP_PATH"

          # 打包真实完整的 Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q PhoneProxy.ipa Payload/
          mv PhoneProxy.ipa ../

      - name: 上传 IPA 安装包
        uses: actions/upload-artifact@v4
        with:
          name: PhoneProxy-IPA
          path: PhoneProxy.ipa
