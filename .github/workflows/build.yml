name: 自动构建 iOS IPA

on:
  # 仅允许手动点击按钮触发
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 初始化日志目录
        run: |
          mkdir -p logs
          echo "=== 编译环境信息 ===" > logs/env_info.log
          xcodebuild -version >> logs/env_info.log 2>&1
          xcrun --sdk iphoneos --show-sdk-path >> logs/env_info.log 2>&1
          cat logs/env_info.log

      - name: 编译并打包应用
        run: |
          set -o pipefail
          echo "=== 获取 iPhoneOS SDK 路径 ===" | tee -a logs/build.log
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK_PATH" | tee -a logs/build.log

          echo "=== 开始编译 iOS arm64 二进制 ===" | tee -a logs/build.log
          # 关键修复：加入 -Xswiftc -sdk 和 sysroot，使编译器正确加载 iOS 标准库
          swift build -c release \
            --triple arm64-apple-ios16.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH" \
            2>&1 | tee -a logs/build.log

          echo "=== 组装 Payload 结构 ===" | tee -a logs/build.log
          mkdir -p build/Payload/MySSH.app
          cp .build/arm64-apple-ios16.0/release/MySSH build/Payload/MySSH.app/ 2>&1 | tee -a logs/build.log
          cp Sources/MySSH/Info.plist build/Payload/MySSH.app/ 2>&1 | tee -a logs/build.log

          echo "=== 正在压制 IPA 文件 ===" | tee -a logs/build.log
          cd build
          zip -r MySSH.ipa Payload 2>&1 | tee -a ../logs/build.log
          cd ..
          echo "=== 打包完成 ===" | tee -a logs/build.log

      - name: 成功时上传 IPA 成品
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-IPA
          path: build/MySSH.ipa

      - name: 捕获并归档全部排错日志 (成功/失败均上传)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译与排错日志-build-logs
          path: logs/
