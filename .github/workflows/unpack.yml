name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q PhoneProxy.zip
          rm -rf PhoneProxy/.github
          cp -a PhoneProxy/. .
          rm -rf PhoneProxy PhoneProxy.zip
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Unpack PhoneProxy"
          git push
