name: PhoneProxy
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 改成你自己的 Bundle ID。扩展的 ID 固定为 "<APP_BUNDLE_ID>.tunnel"
    APP_BUNDLE_ID: com.example.phoneproxy
    # 只有签名流程会传入这两个值（描述文件名称）
    APP_PROFILE_NAME: ""
    EXT_PROFILE_NAME: ""

packages:
  CSSH:
    url: https://github.com/DimaRU/Libssh2Prebuild
    branch: master

targets:
  PhoneProxy:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_NAME)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhoneProxy
        TunnelBundleID: $(APP_BUNDLE_ID).tunnel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/PhoneProxy.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    dependencies:
      - target: PacketTunnel
        embed: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tunnel
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: $(EXT_PROFILE_NAME)
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: PacketTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    dependencies:
      - package: CSSH
      - sdk: libz.tbd
